[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "A reusable Python runtime for AI agents and tool calling."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PyYAML>=6.0",
    "openai",
    "python-dotenv",
]

[project.scripts]
agentkit = "agentkit.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]